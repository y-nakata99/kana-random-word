<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>かなランダム単語ジェネレーター</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>かなランダム単語ジェネレーター</h1>
      <p class="description">文字種を選択し、3〜7文字のランダム文字列を生成します。</p>

      <div class="controls">
        <label for="characterType">文字種</label>
        <select id="characterType" name="characterType">
          <option value="hiragana">ひらがな</option>
          <option value="katakana">カタカナ</option>
          <option value="alphabet">アルファベット</option>
        </select>
      </div>

      <div class="controls">
        <button id="generateButton" type="button">生成</button>
        <button id="copyButton" type="button">コピー</button>
      </div>

      <section class="result-panel" aria-live="polite">
        <h2>生成結果</h2>
        <p id="result" class="result">---</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
